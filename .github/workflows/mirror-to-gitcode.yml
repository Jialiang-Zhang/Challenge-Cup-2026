name: Mirror to GitCode

on:
  push:
    branches:
      - main
    paths-ignore:
      - "output/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mirror only main, or all branches and tags"
        required: true
        type: choice
        default: main
        options:
          - main
          - all

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITCODE_REPO_URL: https://gitcode.com/Obit8886/MathQEDgithub.git
      GITCODE_USERNAME: Obit8886

    steps:
      - name: Check out GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify GitCode token
        shell: bash
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GITCODE_TOKEN}" || (echo "::error::Missing GitHub secret GITCODE_TOKEN" && exit 1)

      - name: Configure GitCode authentication
        shell: bash
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${GITCODE_TOKEN}"
          basic_auth="$(printf '%s:%s' "${GITCODE_USERNAME}" "${GITCODE_TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${basic_auth}"
          git config --global --unset-all http.https://gitcode.com/.extraheader 2>/dev/null || true
          git config --global --add http.https://gitcode.com/.extraheader "Authorization: Basic ${basic_auth}"
          git config --global credential.helper ""
          echo "GIT_TERMINAL_PROMPT=0" >> "${GITHUB_ENV}"

      - name: Add GitCode remote
        shell: bash
        run: |
          set -euo pipefail
          git remote remove gitcode 2>/dev/null || true
          git remote add gitcode "${GITCODE_REPO_URL}"

      - name: Push main branch
        if: ${{ github.event_name == 'push' || inputs.mode == 'main' }}
        shell: bash
        run: |
          set -euo pipefail
          git push gitcode HEAD:refs/heads/main --force
          git push gitcode --tags --force

      - name: Push all branches and tags
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'all' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [ "${branch}" = "HEAD" ] && continue
            git push gitcode "${ref}:refs/heads/${branch}" --force
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)
          git push gitcode --tags --force

name: Run adaptive-contract 112 benchmark 16c

on:
  push:
    branches:
      - benchmark/adaptive-contract-112-16c-20260827
    paths:
      - ".github/workflows/run-112-benchmark.yml"

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      INTERN_API_KEY: ${{ secrets.INTERN_API_KEY }}
      INTERN_MODEL: intern-s2-preview
      LOCAL_MAX_CONCURRENCY: "16"
      PYTHONUNBUFFERED: "1"
      JUPYTER_PLATFORM_DIRS: "1"

    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v4
        with:
          ref: benchmark/adaptive-contract-112-16c-20260827
          fetch-depth: 0

      - name: Check out public dataset
        uses: actions/checkout@v4
        with:
          repository: Jialiang-Zhang/test-dataset-math
          ref: main
          path: _benchmark_dataset
          fetch-depth: 1

      - name: Verify API secret
        shell: bash
        run: |
          if [ -z "${INTERN_API_KEY}" ]; then
            echo "::error::Missing repository Actions secret INTERN_API_KEY"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run repository tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build 112-question input without answers
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("_benchmark_dataset/112")
          target = Path(".benchmark_tmp/full112.jsonl")
          target.parent.mkdir(parents=True, exist_ok=True)
          with target.open("w", encoding="utf-8") as f:
              for idx in range(112):
                  item = json.loads((source / f"{idx}.json").read_text(encoding="utf-8"))
                  f.write(json.dumps({"idx": item["idx"], "problem": item["problem"]}, ensure_ascii=False) + "\n")
          print("Prepared 112 questions with idx/problem only")
          PY

      - name: Run 112 questions at concurrency 16
        shell: bash
        run: |
          RUN_ID="$(date -u +'%Y%m%dT%H%M%SZ')-adaptive16-run${GITHUB_RUN_NUMBER}"
          echo "RUN_ID=${RUN_ID}" >> "${GITHUB_ENV}"
          mkdir -p "output/${RUN_ID}"
          python main.py \
            --input_file .benchmark_tmp/full112.jsonl \
            --output_dir "output/${RUN_ID}"

      - name: Build execution summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          run_id = os.environ.get("RUN_ID")
          if not run_id:
              raise SystemExit("RUN_ID missing")
          out = Path("output") / run_id
          counts = Counter()
          records = []
          for idx in range(112):
              path = out / f"{idx}.json"
              if not path.exists():
                  status = "missing"
                  result = {}
              else:
                  result = json.loads(path.read_text(encoding="utf-8"))
                  status = result.get("status", "unknown")
              counts[status] += 1
              trace = result.get("trace", []) if isinstance(result, dict) else []
              records.append({
                  "idx": idx,
                  "status": status,
                  "response_chars": len(result.get("final_response", "")) if isinstance(result.get("final_response", ""), str) else 0,
                  "trace_steps": len(trace) if isinstance(trace, list) else 0,
                  "error_type": (result.get("error") or {}).get("type") if isinstance(result.get("error"), dict) else None,
              })
          summary = {
              "run_id": run_id,
              "agent_base_commit": "8367b23f1c94b285b397f1de4ec0bc644387935b",
              "dataset_commit": os.popen("git -C _benchmark_dataset rev-parse HEAD").read().strip(),
              "concurrency": 16,
              "total": 112,
              "counts": dict(counts),
              "execution_success_rate": counts.get("success", 0) / 112,
              "records": records,
          }
          (out / "execution_summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary["counts"], ensure_ascii=False))
          PY

      - name: Commit results to benchmark branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "output/${RUN_ID}" ]; then
            echo "::error::No output directory"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "output/${RUN_ID}"
          if ! git diff --cached --quiet; then
            git commit -m "benchmark: adaptive-contract 112x16 ${RUN_ID}"
            git push origin HEAD:benchmark/adaptive-contract-112-16c-20260827
          fi

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-contract-112-16c-${{ env.RUN_ID }}
          path: output/${{ env.RUN_ID }}/
          if-no-files-found: warn
          retention-days: 30

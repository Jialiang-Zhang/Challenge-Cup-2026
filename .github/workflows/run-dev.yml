name: Run dev benchmark

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-dev.yml"
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Number of dev questions to run concurrently (1-3)"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

permissions:
  contents: read

concurrency:
  group: hora-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      INTERN_API_KEY: ${{ secrets.INTERN_API_KEY }}
      INTERN_MODEL: intern-s2-preview-397b
      LOCAL_MAX_CONCURRENCY: ${{ github.event.inputs.concurrency || '1' }}
      JUPYTER_PLATFORM_DIRS: "1"
      PYTHONUNBUFFERED: "1"
      HORA_DEBUG_DIR: sample_outputs/_debug

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify API secret
        shell: bash
        run: |
          if [ -z "${INTERN_API_KEY}" ]; then
            echo "::error::Missing repository Actions secret named INTERN_API_KEY"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run sample_data/dev.jsonl
        run: |
          rm -rf sample_outputs
          python main.py \
            --input_file sample_data/dev.jsonl \
            --output_dir sample_outputs

      - name: Build smoke-test summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from agent.canonicalize import compare_answers

          input_path = Path("sample_data/dev.jsonl")
          output_dir = Path("sample_outputs")
          expected = {}

          for line in input_path.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              item = json.loads(line)
              expected[int(item["idx"])] = str(item.get("answer", ""))

          records = []
          success_count = 0
          mathematical_match_count = 0

          for idx in sorted(expected):
              path = output_dir / f"{idx}.json"
              if not path.exists():
                  records.append({
                      "idx": idx,
                      "status": "missing",
                      "expected": expected[idx],
                      "mathematical_match": False,
                  })
                  continue

              result = json.loads(path.read_text(encoding="utf-8"))
              status = result.get("status", "unknown")
              final_response = str(result.get("final_response", ""))
              relation = compare_answers(expected[idx], final_response)
              mathematical_match = relation == "equivalent"

              success_count += int(status == "success")
              mathematical_match_count += int(mathematical_match)
              transaction = next(
                  (
                      step.get("content", {})
                      for step in reversed(result.get("trace", []))
                      if step.get("step") == "transaction_commit"
                  ),
                  {},
              )
              records.append({
                  "idx": idx,
                  "status": status,
                  "expected": expected[idx],
                  "equivalence": relation,
                  "mathematical_match": mathematical_match,
                  "response_chars": len(final_response),
                  "model_calls": transaction.get("model_calls"),
                  "repair_count": transaction.get("repair_count"),
                  "error_type": result.get("error", {}).get("type"),
              })

          summary = {
              "total": len(expected),
              "success_count": success_count,
              "mathematical_match_count": mathematical_match_count,
              "warning": (
                  "Mathematical matching is a strict local smoke test, not the official judge."
              ),
              "records": records,
          }

          output_dir.mkdir(parents=True, exist_ok=True)
          (output_dir / "dev_summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload dev results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-results-${{ github.run_number }}-${{ github.sha }}
          path: sample_outputs/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce dev smoke test
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("sample_outputs/dev_summary.json")
          if not path.exists():
              raise SystemExit("dev_summary.json was not produced")
          summary = json.loads(path.read_text(encoding="utf-8"))
          total = int(summary.get("total", 0))
          success = int(summary.get("success_count", 0))
          matched = int(summary.get("mathematical_match_count", 0))
          if not total or success != total or matched != total:
              raise SystemExit(
                  f"dev smoke test failed: success={success}/{total}, mathematical_match={matched}/{total}"
              )
          print(f"dev smoke test passed: {matched}/{total}")
          PY

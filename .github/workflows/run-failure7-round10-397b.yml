name: Run focused 397B failure7 round10

on:
  push:
    branches:
      - benchmark/failure7-round10-397b-20260827
    paths:
      - ".github/workflows/run-failure7-round10-397b.yml"

permissions:
  contents: write

jobs:
  failure7:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      INTERN_API_KEY: ${{ secrets.INTERN_API_KEY }}
      INTERN_MODEL: intern-s2-preview-397b
      LOCAL_MAX_CONCURRENCY: "4"
      PYTHONUNBUFFERED: "1"
      JUPYTER_PLATFORM_DIRS: "1"

    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v4
        with:
          ref: benchmark/failure7-round10-397b-20260827
          fetch-depth: 0

      - name: Check out fixed dataset
        uses: actions/checkout@v4
        with:
          repository: Jialiang-Zhang/test-dataset-math
          ref: 73722d85996fad9147aca2015b001153a4d7cbcf
          path: _benchmark_dataset
          fetch-depth: 1

      - name: Verify API secret and model
        shell: bash
        run: |
          set -euo pipefail
          test -n "${INTERN_API_KEY}" || (echo "::error::Missing INTERN_API_KEY" && exit 1)
          test "${INTERN_MODEL}" = "intern-s2-preview-397b" || (echo "::error::397B model id not pinned" && exit 1)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run repository tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build focused input
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ids = [26, 33, 42, 49, 62, 69, 94]
          source = Path("_benchmark_dataset/112")
          target = Path(".benchmark_tmp/failure7-round10-397b.jsonl")
          target.parent.mkdir(parents=True, exist_ok=True)
          with target.open("w", encoding="utf-8") as f:
              for idx in ids:
                  item = json.loads((source / f"{idx}.json").read_text(encoding="utf-8"))
                  f.write(json.dumps({"idx": item["idx"], "problem": item["problem"]}, ensure_ascii=False) + "\n")
          print(ids)
          PY

      - name: Run focused subset with 397B
        shell: bash
        run: |
          RUN_ID="$(date -u +'%Y%m%dT%H%M%SZ')-failure7-round10-397b-run${GITHUB_RUN_NUMBER}"
          echo "RUN_ID=${RUN_ID}" >> "${GITHUB_ENV}"
          mkdir -p "output/${RUN_ID}"
          python main.py --input_file .benchmark_tmp/failure7-round10-397b.jsonl --output_dir "output/${RUN_ID}"

      - name: Build summary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from collections import Counter
          from pathlib import Path
          ids = [26, 33, 42, 49, 62, 69, 94]
          out = Path("output") / os.environ["RUN_ID"]
          counts = Counter()
          records = []
          for idx in ids:
              result = json.loads((out / f"{idx}.json").read_text(encoding="utf-8"))
              status = result.get("status", "unknown")
              counts[status] += 1
              trace = result.get("trace", []) if isinstance(result.get("trace"), list) else []
              gates = [x.get("content", {}) for x in trace if x.get("step") == "candidate_evidence_gate"]
              commit = next((x.get("content", {}) for x in reversed(trace) if x.get("step") == "transaction_commit"), {})
              records.append({
                  "idx": idx,
                  "status": status,
                  "source": commit.get("source"),
                  "candidate_id": commit.get("candidate_id"),
                  "model_calls": commit.get("model_calls"),
                  "repair_count": commit.get("repair_count"),
                  "rejection_gates": gates,
                  "error": result.get("error"),
              })
          summary = {
              "run_id": os.environ["RUN_ID"],
              "model": os.environ["INTERN_MODEL"],
              "agent_base_commit": "eae6847bc1f4ffac8b0d8be6041603403584a048",
              "ids": ids,
              "counts": dict(counts),
              "records": records,
          }
          (out / "failure7_round10_397b_summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Commit results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "output/${RUN_ID}"
          if ! git diff --cached --quiet; then
            git commit -m "benchmark: record focused 397b failure regression ${RUN_ID}"
            git push origin HEAD:benchmark/failure7-round10-397b-20260827
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: failure7-round10-397b-${{ env.RUN_ID }}
          path: output/${{ env.RUN_ID }}/
          retention-days: 14

name: Run smoke4 benchmark

on:
  push:
    branches:
      - benchmark/smoke4-20260827
    paths-ignore:
      - "output/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke4:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      INTERN_API_KEY: ${{ secrets.INTERN_API_KEY }}
      INTERN_MODEL: intern-s2-preview
      LOCAL_MAX_CONCURRENCY: "2"
      PYTHONUNBUFFERED: "1"
      JUPYTER_PLATFORM_DIRS: "1"

    steps:
      - name: Check out agent branch
        uses: actions/checkout@v4
        with:
          ref: benchmark/smoke4-20260827
          fetch-depth: 0

      - name: Check out public dataset
        uses: actions/checkout@v4
        with:
          repository: Jialiang-Zhang/test-dataset-math
          ref: main
          path: _benchmark_dataset
          fetch-depth: 1

      - name: Verify API secret
        shell: bash
        run: |
          if [ -z "${INTERN_API_KEY}" ]; then
            echo "::error::Missing repository Actions secret INTERN_API_KEY"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build four-question input
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ids = [25, 55, 90, 105]
          source = Path("_benchmark_dataset/112")
          target = Path(".benchmark_tmp/smoke4.jsonl")
          target.parent.mkdir(parents=True, exist_ok=True)
          with target.open("w", encoding="utf-8") as f:
              for idx in ids:
                  item = json.loads((source / f"{idx}.json").read_text(encoding="utf-8"))
                  f.write(json.dumps({"idx": item["idx"], "problem": item["problem"]}, ensure_ascii=False) + "\n")
          print(f"Prepared {len(ids)} questions: {ids}")
          PY

      - name: Run smoke4
        shell: bash
        run: |
          RUN_ID="$(date -u +'%Y%m%dT%H%M%SZ')-smoke4-run${GITHUB_RUN_NUMBER}"
          echo "RUN_ID=${RUN_ID}" >> "${GITHUB_ENV}"
          mkdir -p "output/${RUN_ID}"
          python main.py \
            --input_file .benchmark_tmp/smoke4.jsonl \
            --output_dir "output/${RUN_ID}"

      - name: Build review summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = os.environ.get("RUN_ID")
          if not run_id:
              raise SystemExit("RUN_ID missing")
          ids = [25, 55, 90, 105]
          out = Path("output") / run_id
          dataset = Path("_benchmark_dataset/112")
          records = []
          for idx in ids:
              ref = json.loads((dataset / f"{idx}.json").read_text(encoding="utf-8"))
              result_path = out / f"{idx}.json"
              if result_path.exists():
                  result = json.loads(result_path.read_text(encoding="utf-8"))
              else:
                  result = {"status": "missing", "final_response": "", "trace": []}
              records.append({
                  "idx": idx,
                  "subject": ref.get("subject"),
                  "status": result.get("status"),
                  "reference_answer": ref.get("answer"),
                  "final_response": result.get("final_response", ""),
                  "trace_steps": len(result.get("trace", [])) if isinstance(result.get("trace"), list) else 0,
              })
          summary = {
              "run_id": run_id,
              "ids": ids,
              "records": records,
              "warning": "Reference answers are included only in this post-run review file; they were never passed into ReasoningAgent.solve()."
          }
          (out / "smoke4_review.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"run_id": run_id, "statuses": {str(r['idx']): r['status'] for r in records}}, ensure_ascii=False, indent=2))
          PY

      - name: Commit result folder to smoke branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "output/${RUN_ID}" ]; then
            echo "::error::No output folder created"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "output/${RUN_ID}"
          if git diff --cached --quiet; then
            echo "No result changes to commit"
            exit 0
          fi
          git commit -m "benchmark: record smoke4 ${RUN_ID}"
          git push origin HEAD:benchmark/smoke4-20260827

      - name: Upload smoke4 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke4-${{ env.RUN_ID }}
          path: output/${{ env.RUN_ID }}/
          if-no-files-found: warn
          retention-days: 14

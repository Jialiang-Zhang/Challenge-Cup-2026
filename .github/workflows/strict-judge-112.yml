name: Strict judge adaptive-contract 112 run2

on:
  push:
    branches:
      - benchmark/adaptive-contract-112-strict-judge-20260827
    paths:
      - ".github/workflows/strict-judge-112.yml"

permissions:
  contents: write

jobs:
  strict-judge:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      INTERN_API_KEY: ${{ secrets.INTERN_API_KEY }}
      INTERN_MODEL: intern-s2-preview
      PYTHONUNBUFFERED: "1"
      JUPYTER_PLATFORM_DIRS: "1"
      RESULT_DIR: output/20260827T115117Z-adaptive16-run2
      AGENT_COMMIT: 8367b23f1c94b285b397f1de4ec0bc644387935b
      DATASET_COMMIT: 73722d85996fad9147aca2015b001153a4d7cbcf

    steps:
      - name: Check out strict-judge branch
        uses: actions/checkout@v4
        with:
          ref: benchmark/adaptive-contract-112-strict-judge-20260827
          fetch-depth: 0

      - name: Check out exact benchmark dataset
        uses: actions/checkout@v4
        with:
          repository: Jialiang-Zhang/test-dataset-math
          ref: 73722d85996fad9147aca2015b001153a4d7cbcf
          path: _benchmark_dataset
          fetch-depth: 1

      - name: Verify API secret
        shell: bash
        run: |
          if [ -z "${INTERN_API_KEY}" ]; then
            echo "::error::Missing repository Actions secret INTERN_API_KEY"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify result set
        shell: bash
        run: |
          test -d "${RESULT_DIR}"
          test -f "${RESULT_DIR}/execution_summary.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RESULT_DIR"]) / "execution_summary.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["total"] == 112
          assert data["agent_base_commit"] == os.environ["AGENT_COMMIT"]
          print(data["counts"])
          PY

      - name: Run conservative strict double judge
        shell: bash
        run: |
          python scripts/strict_judge_112.py \
            --dataset-dir _benchmark_dataset/112 \
            --output-dir "${RESULT_DIR}" \
            --concurrency 16 \
            --agent-commit "${AGENT_COMMIT}" \
            --dataset-commit "${DATASET_COMMIT}"

      - name: Commit strict judgement files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${RESULT_DIR}/strict_judgements.json" "${RESULT_DIR}/strict_summary.json"
          if ! git diff --cached --quiet; then
            git commit -m "benchmark: strict judge adaptive-contract 112 run2"
            git push origin HEAD:benchmark/adaptive-contract-112-strict-judge-20260827
          fi

      - name: Upload strict judgement artifact
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-contract-112-strict-judge-run2
          path: |
            ${{ env.RESULT_DIR }}/execution_summary.json
            ${{ env.RESULT_DIR }}/strict_summary.json
            ${{ env.RESULT_DIR }}/strict_judgements.json
          retention-days: 30

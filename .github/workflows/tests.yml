name: Unit tests

on:
  pull_request:
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Compile benchmark modules
        run: |
          python -m py_compile \
            scripts/run_112_benchmark.py \
            tests/test_run_112_benchmark.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
